site_name: hydrologeez
site_description: Differentiable conceptual hydrological models in JAX.
repo_url: https://github.com/CooperBigFoot/hydrologeez
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - GR6J model: gr6j.md
  - HBV model: hbv.md
  - Contributor contract: contracts.md

plugins:
  - search
  - markdown-exec
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
