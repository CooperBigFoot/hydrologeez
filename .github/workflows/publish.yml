name: publish

# Builds + twine-checks on pull requests and manual dispatches.
#
# DRY-RUN SCOPE (milestone-1): this workflow has no push or release trigger, so
# ordinary pushes and per-commit v* tags cannot start any upload path. The real
# TestPyPI upload step is guarded to run only on explicit workflow_dispatch with
# dry_run=false.
#
# MANUAL PREREQUISITE before any REAL upload can succeed: register this repo as a
# Trusted Publisher on TestPyPI
# (https://test.pypi.org/manage/account/publishing/) with:
#   PyPI project name: hydrologeez
#   Owner:             CooperBigFoot
#   Repository:        hydrologeez
#   Workflow filename: publish.yml
#   Environment:       testpypi   (must match the `environment:` below)
# No API tokens or secrets are stored in this repo; the upload authenticates via
# the GitHub OIDC id-token only.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate build + OIDC wiring without uploading to TestPyPI"
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel and twine-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Twine check (uv-managed, no pip)
        run: uvx twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi-publish:
    name: TestPyPI Trusted Publishing (guarded dry-run)
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    environment: testpypi
    permissions:
      id-token: write # OIDC: required to mint the Trusted Publishing token
      contents: read
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Validate OIDC / job wiring (dry-run, no upload)
        run: |
          echo "Build + twine check passed in the build job."
          echo "id-token: write permission is granted to this job (OIDC wiring present)."
          echo "Upload step is GUARDED; it runs only on workflow_dispatch with dry_run=false."
          echo "ref=${{ github.ref }} event=${{ github.event_name }}"

      - name: Publish to TestPyPI (Trusted Publishing / OIDC)
        # GUARD: a real upload happens ONLY after explicit manual dispatch with
        # dry_run=false. Pull requests, ordinary pushes, per-commit v* tags, and
        # the default manual dry-run cannot upload.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
