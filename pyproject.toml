[project]
name = "hydrologeez"
version = "0.1.2"
description = "Differentiable conceptual hydrological models (GR6J, HBV) in JAX with gradient and evolutionary calibration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Lazaro" }]
keywords = [
    "hydrology",
    "jax",
    "differentiable",
    "rainfall-runoff",
    "hydrological-modeling",
    "gr6j",
    "hbv",
    "calibration",
    "streamflow",
    "autodiff",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "ctrl-freak>=0.2.1",
    "equinox>=0.13.8",
    "jax>=0.10.2",
    "optax>=0.2.8",
]

[project.urls]
Homepage = "https://github.com/CooperBigFoot/hydrologeez"
Repository = "https://github.com/CooperBigFoot/hydrologeez"
Documentation = "https://cooperbigfoot.github.io/hydrologeez/"
Changelog = "https://github.com/CooperBigFoot/hydrologeez/blob/main/CHANGELOG.md"
Issues = "https://github.com/CooperBigFoot/hydrologeez/issues"

[project.optional-dependencies]
cuda = ["jax[cuda12]"]


[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3", # tests
    "pytest-cov>=6.2.1",
    "ruff>=0.12", # linter + formatter
    "bump-my-version>=1.2.7",
    "ty>=0.0.55",
]
docs = [
    "markdown-exec>=1.12.1",
    "mkdocs-material<9.7",
    "mkdocstrings[python]>=1.0.4",
]

# -----------------------
# Ruff (lint + format)
# -----------------------
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["site/"]

[tool.ruff.lint]
# Errors, warnings, naming, imports, modern py, bugbear, comprehensions, simplify
select = ["E", "F", "W", "N", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501", # let formatter handle wrapping
    "N803", # allow X, Y for ML-style params
    "N806", # allow X, Y for local vars
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# # -----------------------
# # ty (fast static type checker)
# # -----------------------
[tool.ty]

[tool.ty.src]
exclude = ["site/"]
# [tool.ty.rules]
# possibly-unresolved-reference = "warn"

# -----------------------
# Pytest
# -----------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

# -----------------------
# Bump My Version
# -----------------------
[tool.bumpversion]
current_version = "0.1.2"
commit = false
tag = false
allow_dirty = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/hydrologeez/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[tool.uv]
default-groups = ["dev", "docs"]
